<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色對話標記工作坊</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e2dfd6;
  --accent:#1f5f8b; --accent-soft:#e6eff6; --warn:#a4501b; --ok:#2e7d4f;
  --star:#c58a00; --lock:#7a3e9d;
  --c1:#2f6fb0; --c2:#c06b12; --c3:#2e8b57; --c4:#7b4fb3; --c5:#c0392b;
  --c6:#13867f; --c7:#5d6d7e; --c8:#9a8f7a; --c9:#b0306f;
  --sp-maple:#b5532a; --sp-lotus:#2c6fa8; --sp-fruit:#3d8a3a; --sp-vine:#8a4fa3;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  font-size:16px;line-height:1.6}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
header.top .who{color:var(--muted);font-size:14px}
header.top .spacer{flex:1}
.progress{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-size:14px;color:var(--ink)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .done{font-size:12px;opacity:.8;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:20px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}.legend{position:static!important;max-height:none!important}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.intro h2{margin:0 0 8px;font-size:22px}
.intro p{margin:6px 0}
.intro ol{margin:6px 0 6px 1.2em;padding:0}
.field{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}
.field input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 16px}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.excerpt-head h2{margin:0;font-size:20px}
.excerpt-head .src{color:var(--muted);font-size:14px;margin-top:2px}
.context{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:12px 0 4px;font-size:15px}
.hint{color:var(--muted);font-size:13px}
.lines{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ln{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
.ln:focus,.ln.focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,139,.15)}
.ln.tagged{border-left:4px solid var(--accent)}
.ln-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#efede6;color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700}
.sp{flex:0 0 auto;font-weight:700;padding:1px 10px;border-radius:999px;color:#fff;font-size:14px;margin-top:2px;white-space:nowrap}
.sp.楓公爵{background:var(--sp-maple)} .sp.蓮{background:var(--sp-lotus)} .sp.果果{background:var(--sp-fruit)} .sp.蔓蔓{background:var(--sp-vine)}
.txt{flex:1;font-size:17px}
.ctxline{color:var(--muted);font-size:14px;padding:4px 14px;font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 38px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:7px;padding:2px 9px;font-size:14px;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.chip b{font-size:12px;opacity:.7}
.chip.on{color:#fff}
.flags{display:flex;gap:8px;margin:8px 0 0 38px;flex-wrap:wrap;align-items:center}
.flag{border:1.5px dashed var(--line);background:#fff;border-radius:7px;padding:2px 10px;font-size:14px;color:var(--muted)}
.flag.star.on{border-style:solid;border-color:var(--star);background:#fff6dd;color:#7a5600}
.flag.lock.on{border-style:solid;border-color:var(--lock);background:#f4ebf9;color:var(--lock)}
.reason{margin:8px 0 0 38px}
.reason input{width:100%;padding:6px 10px;border:1px solid var(--star);border-radius:7px;background:#fffbef}
.legend{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:16px}
.legend h3{margin:0 0 8px;font-size:16px}
.cat{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.dot{width:24px;height:24px;border-radius:6px;color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.cat .nm{font-weight:700;font-size:14px}
.cat .rl{font-size:13px;color:var(--muted)}
.cat .ex{font-size:12.5px;color:var(--muted);font-style:italic}
.legend .flagdef{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;font-size:14px}
th{background:#faf9f5;font-weight:700}
td.l,th.l{text-align:left}
.sum-block{margin:18px 0}
.sum-block h3{margin:0 0 8px;font-size:17px}
.status{margin-top:10px;font-size:14px}
.status.ok{color:var(--ok)} .status.err{color:var(--warn)}
footer{max-width:1280px;margin:10px auto 30px;padding:0 20px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:var(--muted)}

/* host */
.host .hostbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.host .hostbar input[type=text]{padding:6px 10px;border:1px solid var(--line);border-radius:8px;min-width:340px}
.pill{background:#efede6;border-radius:999px;padding:2px 12px;font-size:14px}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:14px;text-align:center;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.heat td.h{width:44px;font-weight:700;font-size:13px;position:relative}
.heat td.h.ai::after{content:"";position:absolute;inset:3px;border:2.5px solid #111;border-radius:6px}
.heat td.t{text-align:left;font-size:14.5px;max-width:520px}
.heat td.t .why{display:block;color:#444;font-size:12.5px;margin-top:3px;background:#f3f1ea;border-radius:5px;padding:2px 6px}
.heat td.t .reasons{display:block;color:#7a5600;font-size:12.5px;margin-top:3px}
.heat tr.dis td.t{background:#fff3ea}
.agree{font-size:13px}
.agree.low{color:var(--warn);font-weight:700}
.bars .row{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.bars .bar{height:18px;border-radius:4px;background:#ece9e0;overflow:hidden}
.bars .bar span{display:block;height:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.big .heat td.t{font-size:17px} .big th,.big td{font-size:16px}
.mini{font-size:12.5px;color:var(--muted)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;background:#fff}
</style>
</head>
<body>
<header class="top">
  <h1>角色對話標記工作坊</h1>
  <span class="who" id="who"></span>
  <div class="tabs" id="tabs"></div>
  <span class="spacer"></span>
  <span class="progress" id="progress"></span>
</header>

<main id="app"></main>

<footer>
  <span>因材網國中生物教材開發團隊　月聚實作工具　<span id="ver"></span></span>
  <span><a href="#" id="modeLink" class="hidden">返回標記模式</a></span>
</footer>

<script>
/* ============ 設定 ============ */
// 部署 Apps Script 後，將網址貼在下方引號內（或以 ?api=網址 開啟本頁）
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbzL0lCEqONDjQ82FzlaGjYvrYo4NznN9omdqPFQvooM3Su-t1eHZLzgmmvy3OkLwCE92A/exec";
const VERSION = "2026-10-v1";
// 主持人模式通關碼：以 ?host=通關碼 開啟本頁才會進入主持人模式（請自行修改）
const HOST_KEY = "maple1024";

/* ============ 類別 ============ */
const CATS = [
 {id:1, short:"問題", name:"提出問題", rule:"提出想知道、需要釐清或解決的問題", ex:"「為什麼兩組會出現不同結果？」", col:"var(--c1)"},
 {id:2, short:"想法", name:"提出想法、猜測或預測", rule:"提出可能的原因、解釋或預期結果", ex:"「我猜葉片的數量可能會影響吸水量。」", col:"var(--c2)"},
 {id:3, short:"證據", name:"提出觀察或證據", rule:"說出觀察到的現象、資料或相關事例", ex:"「這一組的水位下降得比較多。」", col:"var(--c3)"},
 {id:4, short:"推理", name:"推理與解釋", rule:"說明證據如何支持想法，或解釋現象為什麼、如何發生；須連結到對話中已出現的證據或想法", ex:"「這個結果比較符合甲的預測，因此目前較支持甲的解釋。」", col:"var(--c4)"},
 {id:5, short:"質疑", name:"質疑與檢證", rule:"指出解釋可能的問題，或提出進一步查證的方法", ex:"「會不會是溫度不同？我們應該保持溫度相同再比較。」", col:"var(--c5)"},
 {id:6, short:"整合", name:"整合與修正", rule:"整理線索，補充、修正或保留原先想法，形成暫時結論", ex:"「我原先只注意到根，現在需要把葉片的影響納入解釋。」", col:"var(--c6)"},
 {id:7, short:"知識", name:"知識說明", rule:"提供名詞、背景知識或概念說明；內容從對話之外帶入，未連結對話中的證據", ex:"「蒸散是植物以水蒸氣形式散失水分的現象。」", col:"var(--c7)"},
 {id:8, short:"其他", name:"其他", rule:"主要用於互動回應、情緒表達或情節推進，未明顯執行其他類別的功能", ex:"「好神奇！」「隔天早上，他們再次來到花園。」", col:"var(--c8)"},
 {id:9, short:"評價", name:"確認或評價", rule:"判斷或評價他人說法的對錯、好壞", ex:"「沒錯！」「不是喔！」「你們都分對了！」「很好的推論。」", col:"var(--c9)"}
];
const SPEAKERS = ["楓公爵","蓮","果果","蔓蔓"];

/* ============ 片段 ============ */
const EXCERPTS = [
{id:"A", title:"血糖（一）：她為什麼昏倒？", src:"〈地球人沒吃飯會暈倒？〉第2至10格",
 context:"角色透過電子成像看到地球即時影像：一位女子在院子晾衣服時突然昏倒，被送往醫院。救護人員發現餐桌上的早餐沒有吃，旁邊有注射用針筒與「胰島素」藥盒。",
 lines:[
 {sp:"蓮",t:"為什麼那個地球女子會昏倒？還要送去醫院？她到底怎麼了？"},
 {sp:"蔓蔓",t:"一定是因為地球的太陽太大，曬暈了吧！"},
 {sp:"蓮",t:"是嗎？可是我上次在外面照陽光，越照精神越好！"},
 {sp:"蔓蔓",t:"因為你不是地球人，地球人好像很怕曬太陽。"},
 {sp:"蓮",t:"所以真的是因為在院子曬太陽晾衣服，所以曬暈了？"},
 {sp:"楓公爵",t:"不是喔！你們仔細回想當時的狀況。"},
 {sp:"果果",t:"我們看到注射藥物的針筒和藥物盒？跟藥物有關？"},
 {sp:"蔓蔓",t:"我知道，一定是女子注射太多藥物所以昏倒！"},
 {sp:"果果",t:"是嗎？女子家裡有針筒和藥物，表示她一定知道怎麼使用藥物，怎麼可能注射太多啦！"},
 {sp:"蓮",t:"可是我覺得蔓蔓說得有道理，女子一定是注射太多藥所以昏倒。"},
 {sp:"楓公爵",t:"請再回想現場狀況，還有沒有什麼線索？"},
 {sp:"果果",t:"桌上有沒吃的早餐，跟這個有關嗎？"},
 {sp:"楓公爵",t:"應該有關係喔！"},
 {sp:"蔓蔓",t:"一定是因為女子沒吃早餐所以昏倒，就是這麼簡單。"},
 {sp:"蓮",t:"很有道理，地球人沒吃東西就沒力氣，所以一下子就昏倒了。"},
 {sp:"果果",t:"可是我觀察過很多地球人都不吃早餐，也不是每個人都會昏倒啊！"},
 {sp:"楓公爵",t:"為什麼有些地球人沒吃早餐不會昏倒，但是這個女子卻昏倒了？"},
 {sp:"蔓蔓",t:"一定是沒吃早餐又亂注射藥物，所以昏倒，就是這樣。"},
 {sp:"蓮",t:"所以這個地球女子沒吃早餐，加上注射藥物，所以昏倒，是這樣嗎？"},
 {sp:"楓公爵",t:"這個推論挺合理的，你們可以解釋原因嗎？"},
 {sp:"蔓蔓",t:"我們看到的就是這樣，還有什麼原因？"},
 {sp:"蓮",t:"我不知道～"},
 {sp:"果果",t:"地球人的身體似乎有複雜的運作方式，我認為這個地球女子可能生病了，導致某些身體機能出問題，才造成昏倒的結果。"},
 {sp:"楓公爵",t:"很好的推論，又有影像傳過來了，或許有更多資訊，一起看一下吧！"}
 ]},
{id:"C", title:"內外溫：熱像儀與蓋被子", src:"〈內外有別的溫控系統〉第29至40格、第52至67格",
 context:"跑完馬拉松後，角色討論流汗與體溫。楓公爵拿出地球人的「熱像儀」，準備觀察動物的體溫有什麼差異。",
 lines:[
 {sp:"楓公爵",t:"現在我們用它對準一些動物，來觀察看看有什麼現象吧！"},
 {sp:"蔓蔓",t:"我看到兔子和小狗，他們的影像比環境溫度明顯的高出許多。"},
 {sp:"果果",t:"奇怪，看不到烏龜和蛇的影像欸！怎麼會這樣？"},
 {sp:"楓公爵",t:"你們的發現非常棒喔！因為烏龜和蛇的體溫，與環境溫度很接近，所以熱像儀讓他們隱形了！"},
 {sp:"蔓蔓",t:"喔！烏龜和蛇是一類動物，兔子和小狗是另外一類動物！楓公爵，他們體溫調節的方式是不是不太一樣？"},
 {sp:"楓公爵",t:"蔓蔓說得很好。動物世界調節體溫的方式有兩種，一種主要靠體內產生的熱能來維持體溫，像是兔子和狗，稱之為內溫動物。另外一類動物，主要靠體外的環境溫度來產生體溫，例如烏龜和蛇，稱之為外溫動物。"},
 {ctx:"【中略：第41至51格，討論毛髮與皮下脂肪】"},
 {sp:"蔓蔓",t:"楓公爵，那如果夏天天氣很熱很熱的時候，或是冬天很冷很冷的時候，外溫動物怎麼辦？"},
 {sp:"楓公爵",t:"你想想你夏天的時候喜歡待在哪裡？冬天覺得很冷時又會怎麼辦呢？"},
 {sp:"果果",t:"夏天很熱很熱的時候，我就會避開太陽，躲到陰暗的地方乘涼。冬天嘛！就會多穿一些衣服囉！"},
 {sp:"蔓蔓",t:"所以烏龜很冷的時候他們就蓋被子？？"},
 {sp:"果果",t:"等一下，好像沒有看過烏龜蓋被子或蛇穿衣服欸……？！"},
 {sp:"楓公爵",t:"是的，外溫動物在很熱的時候，的確是會躲在陰涼處避開太陽，但是外溫動物不太能自己產生體熱，而穿衣服的用意是要保持體熱，那麼你覺得外溫動物覺得冷的時候，穿衣服會有效果嗎？"},
 {sp:"果果",t:"自己不能產生體熱，那穿衣服就沒意義了吧！？"},
 {sp:"蔓蔓",t:"喔～難怪外溫動物體表通常沒有毛髮！"},
 {sp:"楓公爵",t:"是的。外溫動物因為自己無法產熱，所以不會有保暖的構造，更別提穿衣服的行為了。那麼你覺得天氣很冷的時候，他們會怎麼設法提高自身溫度呢？試著想想，自然環境中有哪些因素可以幫忙「加熱」呢？"}
 ]},
{id:"D", title:"酵素：口水與糯米紙", src:"〈廚房裡的魔法師－酵素（上）〉第10至18格",
 context:"園遊會前，角色在廚房試做料理。蘋果切片變色引出「酵素」的話題，楓公爵已說明酵素的主要成分是蛋白質。",
 lines:[
 {sp:"蓮",t:"我還聽說早期原住民會將小米團放在口中咀嚼後吐出，靜置隔夜發酵，之後就能釀出小米酒，那小米酒裡面也有酵素嗎？"},
 {sp:"楓公爵",t:"這是酵素作用的例子沒錯，只不過並不是整瓶小米酒都是酵素，酵素在這裡扮演著能促進小米內的成分代謝轉換為其他物質的角色。"},
 {sp:"蓮",t:"那小米酒裡的酵素又是從哪來的呢？"},
 {sp:"果果",t:"（喃喃自語）小米酒是咀嚼過後的小米釀造而來，小米的成分會被酵素轉換為其他物質……如果小米自己就有酵素，那應該放著就會轉變成小米酒，為什麼還要放到嘴裡咀嚼再吐出來？酵素會是從哪來的？……難道是口水！"},
 {sp:"楓公爵",t:"哈～這個推理不錯哦，來～你吐一些唾液在這個容器裡，我現在放進會墊在紅豆年糕下方的「糯米紙」，這個糯米紙跟小米成分類似，都是澱粉。"},
 {ctx:"【畫面：一段時間後，糯米紙變小】"},
 {sp:"蔓蔓",t:"哇～糯米紙變小了耶！唾液這麼厲害啊，那我把一片蘋果也丟進去看看。"},
 {ctx:"【畫面：蘋果片放入裝有唾液的容器】"},

function firstUnfinished(){ return ORDER.find(e=>doneCount(e)<EX[e].count) || "summary"; }
function adopt(p){ S.id = /^[A-Z2-9]{6}$/.test(p.id||"")? p.id : newCode(); S.name=p.name||S.name; S.tags=p.tags||{}; S.final=p.status==="final"; S.view=firstUnfinished(); lastSavedSig=sig(); save(); render(); }
function loadMine(f){ if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const p=JSON.parse(r.result); if(p.kind!=="wk-submission") throw 0; adopt(p); }catch(e){ alert("這不是標記結果檔"); } };

async function fetchMine(){

function refreshCard(ex,n){
  const old = document.querySelector(`.ln[data-n="${n}"]`); if(!old) return;
  const l = EX[ex].lines.find(x=>x.n===n);
  const wrap=document.createElement("div"); wrap.innerHTML=lineCardHTML(ex,l); const nu=wrap.firstElementChild;
  old.replaceWith(nu); bindCard(ex,nu); nu.classList.add("focus");
  renderHeader();
}
function toggleCat(ex,n,c){ const t=T(ex,n); t.c = t.c.includes(c)? t.c.filter(x=>x!==c) : [...t.c,c].sort((a,b)=>a-b); save(); refreshCard(ex,n); focusCard(n); }
function toggleFlag(ex,n,f){ const t=T(ex,n); t[f]=!t[f]; save(); refreshCard(ex,n); if(f==="s"&&t.s){const i=document.querySelector(`.ln[data-n="${n}"] input[data-r]`); if(i) i.focus(); } else focusCard(n); }
function focusCard(n){ const el=document.querySelector(`.ln[data-n="${n}"]`); if(el){ document.querySelectorAll(".ln.focus").forEach(x=>x!==el&&x.classList.remove("focus")); el.classList.add("focus"); if(document.activeElement?.tagName!=="INPUT") el.focus({preventScroll:true}); focusIdx=n; } }
function bindCard(ex,card){
  const n = +card.dataset.n;
  card.addEventListener("click",ev=>{
    const chip=ev.target.closest(".chip"); const flag=ev.target.closest(".flag");
    if(chip){toggleCat(ex,n,+chip.dataset.c);return}
    if(flag){toggleFlag(ex,n,flag.dataset.f);return}
    if(!ev.target.closest("input")) focusCard(n);
  });
  const inp = card.querySelector("input[data-r]");
  if(inp){ inp.addEventListener("input",()=>{T(ex,n).r=inp.value;save();}); inp.addEventListener("keydown",e=>{e.stopPropagation(); if(e.key==="Enter"||e.key==="Escape"){card.focus();}}); }
  card.addEventListener("focus",()=>{focusIdx=n; document.querySelectorAll(".ln.focus").forEach(x=>x!==card&&x.classList.remove("focus")); card.classList.add("focus");});
}
function bindLines(ex){ document.querySelectorAll(".ln").forEach(c=>bindCard(ex,c)); }
document.addEventListener("keydown",e=>{
  if(!ORDER.includes(S.view) || document.activeElement?.tagName==="INPUT" || e.ctrlKey||e.metaKey||e.altKey) return;
  const ex=S.view; const max=EX[ex].count; if(focusIdx<1) return;
  if(/^[1-9]$/.test(e.key)){ e.preventDefault(); toggleCat(ex,focusIdx,+e.key); }
  else if(e.key==="s"||e.key==="S"){ e.preventDefault(); toggleFlag(ex,focusIdx,"s"); }
  else if(e.key==="l"||e.key==="L"){ e.preventDefault(); toggleFlag(ex,focusIdx,"l"); }
  else if(e.key==="ArrowDown"||e.key==="j"){ if(focusIdx<max){e.preventDefault(); focusCard(focusIdx+1); document.querySelector(`.ln[data-n="${focusIdx}"]`)?.scrollIntoView({block:"center",behavior:"smooth"});} }
  else if(e.key==="ArrowUp"||e.key==="k"){ if(focusIdx>1){e.preventDefault(); focusCard(focusIdx-1); document.querySelector(`.ln[data-n="${focusIdx}"]`)?.scrollIntoView({block:"center",behavior:"smooth"});} }
});

/* 統計（單人或AI） */
function speakerMatrix(ex, getTag){ // returns {sp:{cat:count}, lockBy:{sp:n}, starBy:{sp:n}, turns:{sp:n}}
  const m={}, lockBy={}, starBy={}, turns={};
  SPEAKERS.forEach(s=>{m[s]={};CATS.forEach(c=>m[s][c.id]=0);lockBy[s]=0;starBy[s]=0;turns[s]=0;});
  EX[ex].lines.forEach(l=>{ if(l.ctx) return; turns[l.sp]++; const t=getTag(l); if(!t) return;
    (t.c||[]).forEach(c=>m[l.sp][c]++); if(t.l) lockBy[l.sp]++; if(t.s) starBy[l.sp]++; });
  return {m,lockBy,starBy,turns};
}
function matrixTable(mat, opts={}){
  const max = Math.max(1,...SPEAKERS.flatMap(s=>CATS.map(c=>mat.m[s][c.id])));
  const f = v=> opts.avg? v.toFixed(1).replace(/\.0$/,"") : v;
  return `<table><tr><th class="l">角色</th><th>發言</th>${CATS.map(c=>`<th title="${esc(c.name)}"><span class="dot" style="background:${c.col};display:inline-grid;width:20px;height:20px;font-size:11px">${c.id}</span><div class="mini">${esc(c.short)}</div></th>`).join("")}<th>🔒</th><th>⭐</th></tr>
  ${SPEAKERS.map(s=>`<tr><td class="l"><span class="sp ${s}">${s}</span></td><td>${mat.turns[s]}</td>
   ${CATS.map(c=>{const v=mat.m[s][c.id]; const a=v/max; return `<td style="background:rgba(31,95,139,${(a*0.55).toFixed(2)});${a>0.6?"color:#fff;":""}">${v?f(v):"·"}</td>`}).join("")}
   <td>${mat.lockBy[s]?f(mat.lockBy[s]):"·"}</td><td>${mat.starBy[s]?f(mat.starBy[s]):"·"}</td></tr>`).join("")}</table>`;
}

function payload(){
  const flat=[];
  ORDER.forEach(ex=>EX[ex].lines.forEach(l=>{ if(l.ctx) return; const t=(S.tags[ex]||{})[l.n];
    flat.push({ex, label:LABEL[ex], n:l.n, sp:l.sp, c:(t&&t.c)||[], s:!!(t&&t.s), r:(t&&t.r)||"", l:!!(t&&t.l)}); }));
  return {kind:"wk-submission", version:VERSION, id:S.id, name:S.name, ts:new Date().toISOString(), status:S.final?"final":"draft", done:totalDone(), total:totalLines(), tags:S.tags, flat};
}

let CMP = {agg:null, msg:"", ex:"A"};
async function loadAgg(){
  const api=apiUrl();
  if(!api){ CMP.msg="nofile"; return; }
  CMP.msg="loading"; renderCompare();
  try{ const r=await fetch(api+(api.includes("?")?"&":"?")+"mode=agg&t="+Date.now()); const j=await r.json();
    if(!j.open){ CMP.agg=null; CMP.msg="closed"; } else { CMP.agg=j; CMP.msg=""; } }
  catch(e){ CMP.msg = CMP.agg ? "" : "error"; }
  renderCompare();
}
function renderCompare(){
  const head=`<div class="card" style="max-width:1100px;margin:0 auto 14px"><h2 style="margin-top:0">與大家比較</h2>
   <p class="mini">您的標記存在這台電腦的瀏覽器中；全體結果只包含各類別的勾選比例，看不到其他老師的姓名與個別標記。</p>
   <div class="field" style="margin:8px 0">${apiUrl()?`<button class="btn small" id="reload">讀取最新全體結果</button>`:""}
   <label class="btn small ghost" style="display:inline-flex;align-items:center">載入主持人提供的彙整檔<input type="file" id="aggf" accept=".json,application/json" class="hidden"></label></div>
   ${CMP.msg==="loading"?`<p class="status">讀取中……</p>`:""}
   ${CMP.msg==="closed"?`<p class="status err">主持人尚未開放比較。請先等待全場討論，開放後再按「讀取最新全體結果」。</p>`:""}
   ${CMP.msg==="error"?`<p class="status err">讀取失敗，請稍後再試，或向主持人索取彙整檔。</p>`:""}
   ${!apiUrl()&&!CMP.agg?`<p class="status">本頁未連接試算表，請載入主持人提供的彙整檔。</p>`:""}</div>`;
  if(!CMP.agg){ $("#app").innerHTML=head; bindCmp(); return; }
  const A=CMP.agg.agg; let tot=0, sameMaj=0, sameAI=0;
  ORDER.forEach(ex=>EX[ex].lines.forEach(l=>{ if(l.ctx) return; const t=(S.tags[ex]||{})[l.n]; if(!t||!t.c||!t.c.length) return;
    const g=(A[ex]||{})[l.n]; if(!g||!g.N) return; tot++;
    const maj=CATS.filter(c=>(g.pc[c.id]||0)/g.N>=0.5).map(c=>c.id);
    if(jacc(t.c,maj)>=0.5) sameMaj++; if(jacc(t.c,l.ai)>=0.5) sameAI++; }));
  const ex=CMP.ex, e=EX[ex];
  const rows=e.lines.map(l=>{
    if(l.ctx) return `<tr><td colspan="6" class="t mini">${esc(l.ctx)}</td></tr>`;
    const t=(S.tags[ex]||{})[l.n]||{c:[]}; const g=(A[ex]||{})[l.n]||{N:0,pc:{},s:0,l:0};
    const maj=CATS.filter(c=>g.N&&(g.pc[c.id]||0)/g.N>=0.5).map(c=>c.id);
    const diff = t.c&&t.c.length&&g.N&&jacc(t.c,maj)<0.5;
    const minor = CATS.filter(c=>g.pc[c.id] && g.pc[c.id]/g.N<0.2).length;
    const grp = CATS.filter(c=>g.pc[c.id] && g.pc[c.id]/g.N>=0.2).sort((a,b)=>g.pc[b.id]-g.pc[a.id]).map(c=>{const p=Math.round(g.pc[c.id]/g.N*100);
      return `<div style="display:flex;align-items:center;gap:6px;font-size:12.5px"><span style="width:56px">${c.id}${esc(c.short)}</span><span style="flex:1;height:10px;background:#ece9e0;border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${p}%;background:${c.col}"></span></span><span style="width:34px;text-align:right">${p}%</span></div>`}).join("");
    return `<tr class="${diff?"dis":""}"><td>${l.n}</td><td><span class="sp ${l.sp}">${l.sp}</span></td>
      <td class="t">${esc(l.t)}${diff?`<span class="reasons" style="color:var(--warn)">您的判斷與多數老師不同</span>`:""}</td>
      <td class="l">${chipsMini(t.c)}${t.s?" ⭐":""}${t.l?" 🔒":""}</td>
      <td class="l" style="min-width:190px">${grp||"<span class='mini'>—</span>"}${minor?`<div class="mini">另有 ${minor} 類各低於20%</div>`:""}<div class="mini">⭐ ${g.s||0}　🔒 ${g.l||0}　（${g.N} 人）</div></td>
      <td class="l" style="min-width:170px" title="${esc(aiTitle(l))}">${chipsMini(l.ai)}${(l.aiSn||l.aiLn)?`<div class="mini">${AI_RUNS}次中${l.aiSn?` ⭐${l.aiSn}`:""}${l.aiLn?`　🔒${l.aiLn}`:""}</div>`:""}${l.aiU?`<div class="mini" style="color:var(--warn);font-weight:700">⚠ AI判斷分歧</div>`:""}</td></tr>`;
  }).join("");

function buildAgg(list){
  const agg={}; ORDER.forEach(ex=>{agg[ex]={}; EX[ex].lines.forEach(l=>{ if(l.ctx) return; const g={N:0,pc:{},s:0,l:0};
    list.forEach(p=>{const t=tagOf(p,ex,l.n); if(!t) return; if(t.c&&t.c.length){g.N++; t.c.forEach(c=>g.pc[c]=(g.pc[c]||0)+1);} if(t.s) g.s++; if(t.l) g.l++;});
    agg[ex][l.n]=g; }); });
  return {kind:"wk-agg", version:VERSION, open:true, n:list.length, agg};
}

function subsArr(){return Object.values(H.subs)}
function tagOf(p,ex,n){ return (p.tags&&p.tags[ex]&&p.tags[ex][n]) || null; }
function jacc(a,b){ const A=new Set(a),B=new Set(b); if(!A.size&&!B.size) return 1; let i=0; A.forEach(x=>B.has(x)&&i++); return i/(A.size+B.size-i); }

function lineStats(ex,l){
  const ps = subsArr().filter(p=>{const t=tagOf(p,ex,l.n);return t&&t.c&&t.c.length});
  const N=ps.length; const pc={}; CATS.forEach(c=>pc[c.id]=0);
  let stars=0,locks=0; const reasons=[];
  ps.forEach(p=>{const t=tagOf(p,ex,l.n); t.c.forEach(c=>pc[c]++);});
  subsArr().forEach(p=>{const t=tagOf(p,ex,l.n); if(t&&t.s){stars++; if(t.r) reasons.push(t.r);} if(t&&t.l) locks++;});
  let pair=0,sum=0; for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){pair++;sum+=jacc(tagOf(ps[i],ex,l.n).c,tagOf(ps[j],ex,l.n).c);}
  const agree = pair? sum/pair : null;
  const majority = CATS.filter(c=>N && pc[c.id]/N>=0.5).map(c=>c.id);
  return {N,pc,stars,locks,reasons,agree,majority};
}

function avgMatrix(ex){
  const ps=subsArr(); const out=speakerMatrix(ex,()=>null);
  SPEAKERS.forEach(s=>{CATS.forEach(c=>out.m[s][c.id]=0);out.lockBy[s]=0;out.starBy[s]=0;});
  ps.forEach(p=>{const one=speakerMatrix(ex,l=>tagOf(p,ex,l.n)); SPEAKERS.forEach(s=>{CATS.forEach(c=>out.m[s][c.id]+=one.m[s][c.id]/ps.length); out.lockBy[s]+=one.lockBy[s]/ps.length; out.starBy[s]+=one.starBy[s]/ps.length;});});
  return out;
}

function makeDemo(k){
  const out=[]; let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let i=0;i<k;i++){ const tags={};
    EXCERPTS.forEach(e=>{tags[e.id]={}; e.lines.forEach(l=>{ if(l.ctx) return; let c=[...l.ai];
      if(rnd()<0.35&&c.length>1) c=c.slice(0,1);
      if(rnd()<0.3){ const alt=1+Math.floor(rnd()*9); if(!c.includes(alt)) c.push(alt); }
      if(rnd()<0.15) c=[1+Math.floor(rnd()*9)];
      tags[e.id][l.n]={c:[...new Set(c)].sort(),s:l.aiS?rnd()<0.7:rnd()<0.06,r:"",l:l.aiL?rnd()<0.75:rnd()<0.05}; }); });
    out.push({kind:"wk-submission",version:VERSION,id:"demo"+i,name:"模擬"+(i+1),ts:new Date().toISOString(),tags});
  }
  return out;
}

/* ============ 路由 ============ */
const isHost = params.get("host") === HOST_KEY;
if(isHost){ $("#modeLink").classList.remove("hidden");
  $("#modeLink").onclick = e=>{e.preventDefault(); const u=new URL(location.href); u.searchParams.delete("host"); location.href=u.toString();}; }
function render(){
  if(isHost) return renderHost();
  renderHeader();
  if(S.view==="intro"||!S.name) {S.view="intro"; renderHeader(); return renderIntro();}
  if(S.view==="summary") return renderSummary();
  if(S.view==="compare"){ renderCompare(); if(!CMP.agg && apiUrl()) loadAgg(); return; }
  renderExcerpt(S.view);
}
render();
</script>
